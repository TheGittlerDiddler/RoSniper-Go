name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile Windows and macOS binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          # Windows x64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -extldflags '-static'" -o dist/rosniper-windows-amd64.exe .
          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/rosniper-darwin-amd64 .
          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/rosniper-darwin-arm64 .

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
